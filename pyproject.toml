# Inference Station
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "inference-station"
version = "0.1.0"
description = "GPU-only OpenVINO embedding service"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.125.0",
  "uvicorn[standard]==0.38.0",
  "openvino==2026.3.0",
  "transformers==5.2.0",
  "numpy==1.24.4",
  "pydantic==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_station"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
