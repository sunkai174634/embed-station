services:
  embed-station:
    build:
      context: .
      platforms: [linux/amd64]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MODEL_DIR: /models
      MODEL_ID: ${MODEL_ID:-qwen3-embedding-0.6b-int8-ov}
      MODEL_FORMAT: ${MODEL_FORMAT:-openvino}
      DATA_DIR: /data
      INFER_JOBS: "1"
      BATCH_SIZE: "4"
      BATCH_WINDOW_MS: "20"
      MAX_INPUT_TOKENS: "3584"
      MAX_BATCH_ITEMS: "100"
      INFER_TIMEOUT_S: "30"
      TELEMETRY_RETENTION_DAYS: "0"
      LD_LIBRARY_PATH: /hostlocal:/usr/lib/x86_64-linux-gnu/intel-opencl:/usr/lib/x86_64-linux-gnu:/opt/intel/openvino/runtime/3rdparty/tbb/lib:/opt/intel/openvino/runtime/lib/intel64:/opt/intel/openvino/tools/compile_tool
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the read-only model directory}:/models:ro
      - embed_station_data:/data
      - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
      - /usr/local/lib:/hostlocal:ro
      - /usr/lib/x86_64-linux-gnu/intel-opencl:/usr/lib/x86_64-linux-gnu/intel-opencl:ro
      - /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1:/usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libze_intel_gpu_legacy1.so.1:/usr/lib/x86_64-linux-gnu/libze_intel_gpu_legacy1.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libocloc.so:/usr/lib/x86_64-linux-gnu/libocloc.so:ro
      - /usr/lib/x86_64-linux-gnu/libocloc_legacy1.so:/usr/lib/x86_64-linux-gnu/libocloc_legacy1.so:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:?Set VIDEO_GID to the host video group ID}
      - ${RENDER_GID:?Set RENDER_GID to the host render group ID}
    restart: unless-stopped
volumes:
  embed_station_data:
